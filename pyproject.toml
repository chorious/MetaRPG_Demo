[project]
name = "metarpg"
version = "0.7.5"
description = "MetaRPG v0.7.5 - transaction-first agentic narrative pipeline with semantic coverage closure"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
metarpg = "metarpg.cli:main"
metarpg-agentic = "metarpg.agentic.play_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
